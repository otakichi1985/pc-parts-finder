name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block internal documents from publication
        shell: pwsh
        run: |
          $forbidden = git ls-files | Where-Object { $_ -eq 'AGENTS.md' -or $_ -like 'context/*' -or $_ -eq 'context' }
          if ($forbidden) {
            Write-Error "内部文書が公開対象に含まれています: $($forbidden -join ', ')"
            exit 1
          }
          Write-Host "Internal documents check OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Validate tag matches app version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          $cargo = Get-Content app/src-tauri/Cargo.toml -Raw
          $version = [regex]::Match($cargo, 'version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($tag -ne $version) {
            Write-Error "Tag version '$tag' does not match Cargo.toml version '$version'"
            exit 1
          }
          Write-Host "Version OK: $version"

      - name: Build portable exe
        working-directory: app
        run: npm run tauri build -- --no-bundle

      - name: Stage release assets
        shell: pwsh
        run: |
          $exe = "app/src-tauri/target/release/app.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build output not found: $exe"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $exe release/PC-Parts-Finder.exe
          $hash = (Get-FileHash release/PC-Parts-Finder.exe -Algorithm SHA256).Hash
          Set-Content -Path release/PC-Parts-Finder.exe.sha256 -Value "$hash  PC-Parts-Finder.exe"
          Get-ChildItem release | Select-Object Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes.md
          files: |
            release/PC-Parts-Finder.exe
            release/PC-Parts-Finder.exe.sha256